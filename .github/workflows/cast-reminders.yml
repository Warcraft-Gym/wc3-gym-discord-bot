name: Cast reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  post:
    if: github.repository == 'Warcraft-Gym/wc3-gym-discord-bot'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.BACKEND_API_URL }}/jobs/cast-reminders"
